name: CI/CD - Build & Deploy to Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # JOB 1: Build & Test
  # ============================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Scamazon.sln

      - name: Build solution
        run: dotnet build Scamazon.sln --no-restore -c Release

      # Uncomment khi có test project
      # - name: Run tests
      #   run: dotnet test Scamazon.sln --no-build -c Release --verbosity normal

  # ============================================================
  # JOB 2: Deploy lên Render (chỉ khi push vào main)
  # ============================================================
  deploy:
    name: Deploy to Render
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "Triggering deploy on Render..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")

          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 201 ]; then
            echo "Deploy triggered successfully (HTTP $STATUS)"
          else
            echo "Deploy trigger failed (HTTP $STATUS)"
            exit 1
          fi

      - name: Notify deploy started
        run: echo "Deployment started on Render. Check https://dashboard.render.com for status."
